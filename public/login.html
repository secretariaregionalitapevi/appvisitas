<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Login - Registros de Visitas - Regional Itapevi</title>
  <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png?v=4" />
  <link rel="shortcut icon" type="image/png" href="/favicon.png?v=4" />
  <link rel="stylesheet" href="/styles/main.css?v=1.0.1" />
  <link rel="manifest" href="/manifest.json?v=4" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="CCB Visitas" />
  <link rel="apple-touch-icon" href="/icon-512.png?v=4" />
  <link rel="icon" sizes="192x192" href="/icons/icon-192.png?v=4" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/scripts/auth.js?v=1.0.1"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body.login-page {
      background: #f1f5f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
    }

    .login-page .auth-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 0;
    }

    .login-page .sac-card {
      width: min(560px, 100%);
    }

    @media (max-width: 640px) {
      body.login-page {
        padding: 8px;
      }

      .login-page .sac-card {
        width: 100%;
        max-width: none;
        border-radius: 14px;
      }

      .login-page .sac-header {
        padding: 28px 20px;
      }

      .login-page .sac-body {
        padding: 24px 20px 28px;
      }

      .login-page .sac-form .form-group {
        min-height: 56px;
      }

      .login-page .sac-form .input-icon-box,
      .login-page .password-toggle {
        width: 54px;
        min-width: 54px;
      }

      .login-page .sac-form input,
      .login-page .sac-form select {
        height: 56px;
        font-size: 16px;
        padding: 0 16px !important;
      }

      .login-page .sac-btn {
        height: 52px;
        font-size: 15px;
        border-radius: 12px;
        margin-top: 24px;
      }

      .login-page .sac-footer-links {
        margin-top: 24px;
      }

      .login-page .sac-page-footer {
        margin-top: 24px;
        padding-bottom: 20px;
      }
    }
  </style>
</head>

<body class="login-page">

  <main class="auth-wrap">
    <div class="sac-card">
      <div class="sac-header">
        <img src="/assets/logo-ccb.png?v=4" alt="CCB" class="sac-logo" />
        <h1 class="sac-title">Registros de Visitas</h1>
        <p class="sac-subtitle">Acompanhamento Regional - Visitas</p>
      </div>

      <div class="sac-body">
        <form id="loginForm" class="sac-form">
          <div class="form-group">
            <div class="input-icon-box">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
              </svg>
            </div>
            <input type="email" name="email" placeholder="E-mail" required />
          </div>

          <div class="form-group">
            <div class="input-icon-box">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </div>
            <input type="password" name="password" id="loginPassword" placeholder="Sua senha" required />
            <div class="password-toggle" onclick="togglePassword('loginPassword')">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </div>
          </div>

          <p id="loginFeedback" style="color: var(--err); font-size: 14px; min-height: 20px;"></p>

          <button type="submit" class="sac-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
            LOGIN
          </button>

          <div style="margin-top: 15px;">
            <a href="#" style="color: #64748b; text-decoration: none; font-size: 13px;">Esqueceu a senha?</a>
          </div>
        </form>

        <div class="sac-footer-links">
          N&atilde;o tem uma conta?<br>
          <a href="/registro.html" class="sac-btn-secondary">Criar conta</a>
        </div>
      </div>
    </div>

    <footer class="sac-page-footer">
      <span class="footer-brand">&copy; Aplicativo de Visitas v1.1</span>
      <span class="footer-ccb">Registros de Visitas</span>
      <span class="footer-region">Regional Itapevi</span>
    </footer>
  </main>

</body>
</html>
