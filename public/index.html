<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Principal - Registros de Visitas - Regional Itapevi</title>
  <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png?v=4" />
  <link rel="shortcut icon" type="image/png" href="/favicon.png?v=4" />
  <link rel="stylesheet" href="/styles/main.css?v=1.0.4" />
  <link rel="manifest" href="/manifest.json?v=4" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="CCB Visitas" />
  <link rel="apple-touch-icon" href="/icon-512.png?v=4" />
  <link rel="icon" sizes="192x192" href="/icons/icon-192.png?v=4" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/scripts/auth.js?v=1.0.1"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body style="margin: 0; background: #f1f5f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column;">

  <div class="top-nav">
    <div style="display: flex; align-items: center; gap: 12px;">
      <img src="/assets/logo-ccb.png?v=4" style="height: 46px; filter: brightness(0.2);" alt="CCB" />
      <span style="font-weight: 700; color: var(--brand);">Regional Itapevi</span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px;">
      <a href="#" id="btnLogoutTop" class="btn-logout">Sair</a>
    </div>
  </div>

  <main class="auth-wrap" style="padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%;">
    <div class="sac-card" style="position: relative;">
      <header class="sac-header">
        <img src="/assets/logo-ccb.png?v=4" alt="CCB" class="sac-logo" />
        <h1 class="sac-title">Registros de Visitas</h1>
        <p class="sac-subtitle" style="line-height: 1.4;">Controle de Visitas<br>Regional Itapevi</p>
      </header>

      <div class="sac-body">
        <form id="selectionForm" class="sac-form">
          <!-- Mes -->
          <div class="form-group">
            <div class="input-icon-box">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y1="10"></line></svg>
            </div>
            <select id="mes" name="mes" required></select>
          </div>

          <input type="hidden" id="municipio" name="municipio" required />
          <input type="hidden" id="comum" name="comum" required />

          <!-- Comum -->
          <div class="form-group">
            <div class="input-icon-box">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
            </div>
            <div class="sac-search-container">
              <input type="text" id="comumSearch" placeholder="Pesquise sua Comum..." autocomplete="off" />
              <div id="comumResults" class="sac-search-results"></div>
            </div>
          </div>

          <div style="margin-top: 30px;">
            <p style="margin-bottom: 20px; color: #64748b; font-size: 14px;">Preencha os dados acima para acessar o formul&aacute;rio:</p>
            <button type="button" id="btnProsseguir" class="sac-btn" style="margin-top: 0; font-size: 15px;">ABRIR FORMUL&Aacute;RIO DE VISITAS</button>
          </div>
        </form>
      </div>
    </div>

    <footer class="sac-page-footer">
      <span class="footer-brand">&copy; Aplicativo de Visitas v1.1</span>
      <span class="footer-ccb">Registros de Visitas</span>
      <span class="footer-region">Regional Itapevi</span>
    </footer>
  </main>

  <script>
    // Proteger a rota e popular UI
    window.addEventListener('load', async () => {
      window.currentUser = await window.checkAuth();

      // Popular Comuns (Casas de Oracao)
      const comumInput = document.getElementById('comum');
      const comumSearch = document.getElementById('comumSearch');
      const comumResults = document.getElementById('comumResults');
      let allComuns = [];
      const findComum = (value = '') => {
        const term = String(value || '').trim().toLowerCase();
        if (!term) return null;
        return allComuns.find((item) => String(item.comum || '').trim().toLowerCase() === term) || null;
      };

      try {
        const resComuns = await fetch('/api/comuns');
        allComuns = await resComuns.json();

        const renderResults = (filter = '') => {
          const filtered = allComuns.filter((c) =>
            c.comum.toLowerCase().includes(filter.toLowerCase()) ||
            c.cidade.toLowerCase().includes(filter.toLowerCase())
          );

          comumResults.innerHTML = filtered.map((c) => `
            <div class="sac-search-item" data-value="${c.comum}" data-city="${c.cidade}">
              <strong>${c.comum}</strong><br>
              <small style="color: #64748b">${c.cidade}</small>
            </div>
          `).join('');

          comumResults.classList.toggle('active', filtered.length > 0 && filter !== '');
        };

        comumSearch.addEventListener('input', (e) => renderResults(e.target.value));
        comumSearch.addEventListener('focus', () => {
          if (comumSearch.value === '') renderResults('');
          comumResults.classList.add('active');
        });

        comumResults.addEventListener('mouseover', (e) => {
          const item = e.target.closest('.sac-search-item');
          if (item) item.style.background = '#f1f5f9';
        });

        comumResults.addEventListener('mousedown', (e) => {
          const item = e.target.closest('.sac-search-item');
          if (item) {
            const val = item.dataset.value;
            const city = item.dataset.city;
            document.getElementById('comum').value = val;
            comumSearch.value = val;
            document.getElementById('municipio').value = city;
            comumResults.classList.remove('active');
          }
        });

        document.addEventListener('click', (e) => {
          if (!comumSearch.contains(e.target) && !comumResults.contains(e.target)) {
            comumResults.classList.remove('active');
          }
        });

        // Se o usuario tem uma comum no perfil, pre-selecionar e travar
        try {
          const userEmail = window.currentUser.email || '';
          console.log(`Buscando perfil para ID: ${window.currentUser.id} e Email: ${userEmail}`);

          const profileRes = await window.authFetch(`/api/profile?id=${window.currentUser.id}&email=${encodeURIComponent(userEmail)}`);
          let profile = await profileRes.json();
          console.log('Dados do perfil recebidos:', profile);

          // Verificação de permissão baseada em nível/cargo para Visitas
          const allowedRoles = [1, 2, 3, 4, 6];
          const userRoleId = parseInt(profile.role_id || profile.nivel || 0, 10);
          if (!allowedRoles.includes(userRoleId)) {
            document.getElementById('mes').disabled = true;
            document.getElementById('comumSearch').disabled = true;
            const btnProsseguir = document.getElementById('btnProsseguir');
            if (btnProsseguir) {
              btnProsseguir.disabled = true;
              btnProsseguir.style.opacity = '0.5';
              btnProsseguir.style.cursor = 'not-allowed';
              btnProsseguir.onclick = null;
            }

            Swal.fire({
              title: 'Acesso Restrito',
              html: `<div style="text-align: left; font-size: 14px; line-height: 1.6; color: #475569;">
                      <p style="margin-bottom: 12px;">Olá, <strong>${profile.full_name || 'Usuário'}</strong>!</p>
                      <p style="margin-bottom: 12px;">Seu nível de acesso atual (<strong>${profile.cargo || 'Não especificado'}</strong>) não possui permissão para acessar o aplicativo de Visitas.</p>
                      <p style="margin-bottom: 12px; font-weight: 600; color: #b91c1c;">⚠️ Lançamentos nesta seção são permitidos apenas para a equipe autorizada regional.</p>
                      <p style="margin-top: 15px; font-size: 13px; color: #64748b;">Se você acredita que isso é um erro, entre em contato com o Secretário Regional da Música.</p>
                     </div>`,
              icon: 'warning',
              showConfirmButton: false,
              allowOutsideClick: false,
              allowEscapeKey: false,
              background: 'rgba(255, 255, 255, 0.95)',
              backdrop: `rgba(15, 23, 42, 0.85)`
            });
          }

          // Fallback para metadata do usuario se o perfil no banco estiver vazio
          if ((!profile || !profile.comum) && window.currentUser.user_metadata) {
            const meta = window.currentUser.user_metadata;
            console.log('Dados de metadata encontrados:', meta);

            const userComum = meta.comum || meta.comum_congregacao || meta.congregacao || meta.polo || meta.polo_participacao || '';
            const userCity = meta.cidade || meta.municipio || (findComum(userComum) || {}).cidade || meta.polo || 'Itapevi';

            if (userComum) {
              console.log('Comum descoberta via metadata:', userComum);
              profile = {
                comum: userComum,
                cidade: userCity,
                full_name: meta.full_name || meta.nome || ''
              };

              fetch('/api/profile', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: window.currentUser.id, email: userEmail, ...profile })
              }).catch(() => {});
            }
          }

          if (profile && profile.comum) {
            const userComum = profile.comum;
            const userCity = profile.cidade || (findComum(userComum) || {}).cidade || 'Itapevi';

            comumInput.value = userComum;
            comumSearch.value = userComum;
            comumSearch.readOnly = true;
            document.getElementById('municipio').value = userCity;

            const group = comumSearch.closest('.form-group');
            group.classList.add('is-locked');

            // Trocar icone para cadeado
            const iconBox = group.querySelector('.input-icon-box');
            iconBox.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>`;

            comumSearch.placeholder = 'Sua Comum esta fixada';
            console.log('Trava de Comum aplicada com sucesso:', { userComum, userCity });
          }
        } catch (profileErr) {
          console.error('Erro ao buscar perfil detalhado:', profileErr);
        }
      } catch (err) {
        console.error('Erro ao carregar comuns:', err);
      }

      const mesSelect = document.getElementById('mes');
      const meses = ['Janeiro', 'Fevereiro', 'Marco', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
      const now = new Date();
      meses.forEach((m, i) => {
        const opt = document.createElement('option');
        opt.value = m;
        opt.textContent = m;
        if (i === now.getMonth()) opt.selected = true;
        mesSelect.appendChild(opt);
      });

      const handleNavigation = () => {
        const mes = document.getElementById('mes').value;
        const comum = document.getElementById('comum').value;
        let municipio = document.getElementById('municipio').value;

        if (!mes || !municipio || !comum) {
          const searchVal = document.getElementById('comumSearch').value;
          if (searchVal && (!comum || !municipio)) {
            const firstResult = document.querySelector('.sac-search-item');
            if (firstResult) {
              document.getElementById('comum').value = firstResult.dataset.value;
              document.getElementById('municipio').value = firstResult.dataset.city;
              return handleNavigation();
            }
          }

          Swal.fire({
            title: 'Campos Incompletos',
            text: 'Por favor, selecione o Mes e a Casa de Oracao antes de prosseguir.',
            icon: 'warning',
            confirmButtonColor: '#1e4b7a'
          });
          return;
        }

        const configData = {
          mes,
          municipio,
          comum,
          type: 'monthly'
        };

        sessionStorage.setItem('visitas_config', JSON.stringify(configData));
        window.location.href = '/visitas.html';
      };

      // Configurar botao unico
      const btnProsseguir = document.getElementById('btnProsseguir');
      if (btnProsseguir) {
        btnProsseguir.onclick = () => handleNavigation();
      }

      // Botao sair (logout)
      const btnSair = document.getElementById('btnLogoutTop');
      if (btnSair) {
        btnSair.onclick = async () => {
          if (!window.supabaseClient) await window.initSupabase();
          await window.supabaseClient.auth.signOut();
          window.location.href = '/login.html';
        };
      }
    });
  </script>
</body>
</html>
